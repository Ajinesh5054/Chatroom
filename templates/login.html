{% extends "base.html" %}
{% block content %}
<div class="card auth">
<h1>Login</h1>
<p>Sign in to your real-time chat account.</p>
<form method="post">
<input name="username" placeholder="Username" required>
<input name="password" type="password" placeholder="Password" required>
<button>Login</button>
</form>
<p>New user? <a href="{{ url_for('signup') }}">Create an account</a></p>
</div>
{% endblock %}
